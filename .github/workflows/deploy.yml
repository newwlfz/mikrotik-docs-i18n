# .github/workflows/deploy.yml
name: 自动构建与部署文档站点

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ===== 阶段1：下载官方文档（增量） =====
      - name: 拉取英文文档
        run: python fetch_docs.py

      # ===== 阶段2：增量翻译 =====
      - name: 翻译文档
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python translate.py
        # 如果退出码非0，后续步骤不会执行

      # ===== 阶段3：提交已下载/翻译的文件到仓库 =====
      - name: 提交文档和翻译
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ i18n/ sync_state.json
          if git diff --staged --quiet; then
            echo "无变更需要提交"
          else
            git commit -m "chore: 更新文档和翻译 [skip ci]"
            git push
          fi

      # ===== 阶段4：构建（仅当翻译成功时） =====
      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装 npm 依赖并打包 Docusaurus
        run: |
          npm ci
          npm run build

      - name: 部署至 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true
